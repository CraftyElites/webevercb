          <p class="sub" id="sub1"></p>
          <button type="button" class="btn btn-g" id="google" hidden style="display:none">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
            <span id="gtxt"></span>
          </button>
          <div class="or" hidden style="display:none">or</div>
          <form id="f1" novalidate>
            <label>Email
              <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@company.com" required>
            </label>
            <p class="msg" id="msg1" role="alert"></p>
            <button type="submit" class="btn btn-p">Continue</button>
          </form>
          <p class="swap"><span id="swapTxt"></span> <button type="button" class="lnkbtn" id="swapBtn"></button></p>
          <p class="legal" id="legal">By continuing you agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
        </section>

        <!-- Step 2: rest of the details -->
        <section class="step" id="s2" hidden>
          <h1 id="h2"></h1>
          <p class="sub" id="sub2"></p>
          <div class="chip"><span id="chipEmail"></span><button type="button" class="lnkbtn" id="change">Change</button></div>
          <form id="f2" novalidate>
            <label id="nameWrap">Full name
              <input id="name" type="text" autocomplete="name" placeholder="Ada Okafor">
            </label>
            <label>Password
              <span class="in">
                <input id="pw" type="password" placeholder="At least 8 characters">
                <button type="button" class="eye" id="eye" aria-label="Show password">Show</button>
              </span>
            </label>
            <div class="row">
              <span class="hint" id="pwHint">Use 8 or more characters.</span>
              <a class="lnk" id="forgot" href="/auth/forgot" hidden>Forgot password?</a>
            </div>
            <p class="msg" id="msg2" role="alert"></p>
            <button type="submit" class="btn btn-p" id="go"></button>
          </form>
        </section>
      </div>
    </main>
    <footer>&copy; 2026 Webever Labs</footer>
  </div>

  <aside class="right" aria-hidden="true">
    <div class="art">
      <!-- Swap this src for a real photo any time -->
      <img id="art" alt="" width="900" height="1100">
      <div class="cap"><b>Build once. Ship everywhere.</b><span>Hybrid apps for web, Android and iOS, plus research and 1 GB of Auxa Cloud to start.</span></div>
    </div>
  </aside>
</div>

<script>
(function () {
  /* Use same origin as the page (works on any hosted domain) */
  var CFG = { 
    api: window.location.origin, 
    signup: '/api/auth/signup', 
    login: '/api/auth/login', 
    google: '/api/auth/google', 
    next: nextUrl()
  };
  var $ = function (id) { return document.getElementById(id); };
  /* Where to go after auth: ?next=/some/path on this site, else the dashboard */
  function nextUrl() {
    var n = new URLSearchParams(location.search).get('next');
    return (n && /^\/(?!\/)/.test(n)) ? n : '/dashboard';
  }
  /* Already signed in? Skip straight to the dashboard */
  try { if (localStorage.getItem('webever.token')) { location.replace(nextUrl()); } } catch (e) {}
  var T = {
    signup: { title: 'Create your account | Webever Labs', h1: 'Create your account', sub1: 'Build hybrid software and run research. 1 GB of Auxa Cloud is free.', g: 'Sign up with Google', swap: 'Already have an account?', swapBtn: 'Log in', h2: 'Finish your account', sub2: 'Add your name and a password to get started.', go: 'Create account', ac: 'new-password' },
    login: { title: 'Log in | Webever Labs', h1: 'Welcome back', sub1: 'Log in to pick up where you left off.', g: 'Log in with Google', swap: 'New to Webever?', swapBtn: 'Create an account', h2: 'Enter your password', sub2: 'Log in to continue.', go: 'Log in', ac: 'current-password' }
  };
  var mode = 'signup', email = '';

  function read() { return new URLSearchParams(location.search).get('s') === 'login' ? 'login' : 'signup'; }
  function show(n) {
    ['s1', 's2'].forEach(function (id) { var el = $(id); el.hidden = id !== 's' + n; if (id === 's' + n) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; } });
    setTimeout(function () { var f = n === 1 ? $('email') : (mode === 'signup' ? $('name') : $('pw')); try { f.focus({ preventScroll: true }); } catch (e) {} }, 60);
  }
  function render(m, push) {
    mode = m;
    var t = T[m];
    document.title = t.title;
    $('h1').textContent = t.h1; $('sub1').textContent = t.sub1; $('gtxt').textContent = t.g;
    $('swapTxt').textContent = t.swap; $('swapBtn').textContent = t.swapBtn;
    $('h2').textContent = t.h2; $('sub2').textContent = t.sub2; $('go').textContent = t.go;
    $('nameWrap').hidden = m === 'login'; $('pwHint').hidden = m === 'login'; $('forgot').hidden = m === 'signup'; $('legal').hidden = m === 'login';
    $('pw').setAttribute('autocomplete', t.ac);
    $('msg1').textContent = ''; $('msg2').textContent = '';
    if (push) { try { var q = new URLSearchParams(location.search); q.set('s', m); history.replaceState(null, '', location.pathname + '?' + q.toString()); } catch (e) {} }
  }
  $('swapBtn').addEventListener('click', function () { render(mode === 'signup' ? 'login' : 'signup', true); show(1); });
  window.addEventListener('popstate', function () { render(read(), false); show(1); });

  function say(id, text, ok) { $(id).textContent = text; $(id).className = 'msg' + (ok ? ' ok' : ''); }
  function bad(el, on) { el.setAttribute('aria-invalid', on ? 'true' : 'false'); }

  /* Google: server redirects to Google's consent screen */
  $('google').addEventListener('click', function () {
    location.href = CFG.api + CFG.google + '?mode=' + mode + '&prompt=consent&next=' + encodeURIComponent(CFG.next);
  });

  $('f1').addEventListener('submit', function (e) {
    e.preventDefault();
    email = $('email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { bad($('email'), true); say('msg1', 'Enter a valid email address.'); $('email').focus(); return; }
    bad($('email'), false); say('msg1', '');
    $('chipEmail').textContent = email;
    show(2);
  });
  $('change').addEventListener('click', function () { say('msg2', ''); show(1); });

  $('eye').addEventListener('click', function () {
    var s = $('pw').type === 'password';
    $('pw').type = s ? 'text' : 'password';
    this.textContent = s ? 'Hide' : 'Show';
    this.setAttribute('aria-label', s ? 'Hide password' : 'Show password');
  });

  $('f2').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('name').value.trim(), pw = $('pw').value;
    bad($('name'), false); bad($('pw'), false);
    if (mode === 'signup' && !name) { bad($('name'), true); say('msg2', 'Enter your name.'); $('name').focus(); return; }
    if (pw.length < 8) { bad($('pw'), true); say('msg2', 'Password needs at least 8 characters.'); $('pw').focus(); return; }
    var btn = $('go'), label = btn.textContent;
    btn.disabled = true; btn.textContent = 'One moment...'; say('msg2', '');
    fetch(CFG.api + CFG[mode], {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mode === 'signup' ? { name: name, email: email, password: pw } : { email: email, password: pw })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      if (!res.ok) throw new Error((res.d && res.d.error) || 'Something went wrong. Please try again.');
      if (!res.d || !res.d.token) throw new Error('Server did not return a session. Please try again.');
      try {
        localStorage.setItem('webever.token', res.d.token);
        localStorage.setItem('webever.user', JSON.stringify(res.d.user || {}));
      } catch (e) { throw new Error('Your browser blocked saving the session. Enable site storage and try again.'); }
      say('msg2', mode === 'signup' ? 'Account created. Redirecting...' : 'Logged in. Redirecting...', true);
      setTimeout(function () { location.href = CFG.next; }, 400);
    }).catch(function (err) {
      say('msg2', err && err.message && err.message !== 'Failed to fetch' ? err.message : 'Could not reach the server. Check your connection and try again.');
      btn.disabled = false; btn.textContent = label;
    });
  });

  /* Picture card art (generated, swap for a photo if you like) */
  var gid = 0;
  function blob(x, y, r, c, o) { gid++; return '<radialGradient id="g' + gid + '"><stop offset="0" stop-color="' + c + '" stop-opacity="' + o + '"/><stop offset="1" stop-color="' + c + '" stop-opacity="0"/></radialGradient><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="url(#g' + gid + ')"/>'; }
  (function () {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice"><rect width="900" height="1100" fill="#0a0c10"/>';
    s += blob(140, 120, 520, '#1A62D4', .6) + blob(760, 420, 460, '#9646eb', .55) + blob(300, 940, 520, '#f5720f', .3) + blob(820, 980, 360, '#19d3c5', .25);
    var C = ['#3D78E8', '#a78bfa', '#ff6bb5', '#19d3c5', '#7b8797'], sd = 9;
    var r = function () { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
    for (var n = 0; n < 16; n++) {
      var x = 90 + Math.floor(r() * 4) * 44, y = 110 + n * 36, k = 2 + Math.floor(r() * 3);
      for (var j = 0; j < k; j++) { var w = 50 + Math.floor(r() * 130); s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="12" rx="6" fill="' + C[Math.floor(r() * 5)] + '" opacity=".8"/>'; x += w + 18; }
    }
    $('art').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s + '</svg>');
  })();

  render(read(), false);
  show(1);
})();
</script>
</body>
</html>
