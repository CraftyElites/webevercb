.drive-search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.drive-search .inp{border:0;background:transparent;padding:4px 0;width:100%;min-width:0;box-shadow:none}
.drive-actions{display:flex;gap:8px;flex:none}
.drive-seg{flex:none}
.fi.folder{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 8px 12px;border-radius:20px;background:transparent;border:1px solid transparent;cursor:pointer}
.fi.folder:hover{background:var(--panel);border-color:var(--line)}
.fi-top{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 2px;margin-bottom:4px;min-height:20px}
.fi-tag{font-size:.65rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.fi-dots{border:0;background:transparent;color:var(--muted);font-size:1rem;line-height:1;padding:2px 6px;border-radius:8px;cursor:pointer;letter-spacing:1px}
.fi-dots:hover{color:var(--ink);background:var(--raised)}
.fi-icon{width:80px;height:72px;display:grid;place-items:center;margin:4px 0 8px}
.fi-icon svg{width:72px;height:72px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.fi-name{font-size:.82rem;font-weight:700;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-meta{display:flex;justify-content:center;gap:12px;margin-top:4px;font-size:.68rem;color:var(--muted);width:100%}
.fi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px 6px}
@media(max-width:560px){.fi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.site-hub,.site-setup{max-width:520px;margin:24px auto;padding:8px 12px 40px}
.site-hub h2,.site-setup h2{font:700 1.4rem var(--display);margin:12px 0 8px}
.site-list{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.site-list-item{text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.site-list-item:hover{border-color:var(--ink)}
.site-tpls{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.site-tpl{text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.site-tpl.on{border-color:#1a9bff;box-shadow:0 0 0 1px #1a9bff}
.site-tpl span{font-size:.82rem;color:var(--muted)}
.site-accents{display:flex;gap:10px;margin-bottom:14px}
.site-swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.site-swatch.on{border-color:#fff;box-shadow:0 0 0 2px #1a9bff}

.site-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #242a36;background:#0f1218;flex:none;flex-wrap:nowrap;min-height:52px}
.site-top-title{font:600 .95rem var(--display);outline:none;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-top .btn,.site-top .btn.g{flex:none;padding:8px 10px;font-size:.78rem;white-space:nowrap}
.site-top .ib{flex:none}
@media(max-width:560px){
  .site-top{gap:6px;padding:10px 8px}
  .site-top .btn{padding:8px 8px;font-size:.72rem}
  .site-top-title{font-size:.88rem;max-width:28vw}
}
.site-layer{z-index:200}

.dif-layout{display:grid;gap:14px;margin-top:8px}
@media(min-width:900px){.dif-layout{grid-template-columns:1.2fr .9fr;align-items:start}}
.diff-qa{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--raised)}.diff-build{margin:14px 0}.sbp-hero-split{display:grid;gap:16px}@media(min-width:700px){.sbp-hero-split{grid-template-columns:1.1fr .9fr;align-items:center}}.sbp-hero-art{min-height:120px;border-radius:16px;background:linear-gradient(135deg,#1a2740,#2a1850)}.sbp-feat-list .sbp-list-row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}.sbp-nav-min{opacity:.9}.sbp-logos-muted i{opacity:.4}.sbp-cta-center{text-align:center}.sbp-quotes-plain blockquote{background:transparent;border:0;padding:8px 0}.sbp-nav-links{display:flex;gap:12px;flex-wrap:wrap;opacity:.8}
.wurl-chat{position:fixed;right:16px;bottom:16px;width:min(300px,90vw);background:#12151c;border:1px solid #2a3140;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:5;box-shadow:0 12px 40px rgba(0,0,0,.4)}

.ph h1{font-size:1.32rem}
.card{padding:16px;border-radius:18px}
.card h3{font-size:.95rem}
.sub{font-size:.78rem}
.kv{font-size:1.5rem}
.btn{padding:7px 14px;font-size:.88rem}
.nav{padding:6px 10px;font-size:.9rem}
.grp{font-size:.68rem}
.side{width:220px}
#view{padding:20px 22px 48px}
.ubs-card,.ubs{padding:12px!important;border-width:1px!important;border-color:var(--line2)!important;background:var(--raised)!important;border-radius:14px!important;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.file-preview{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;max-height:420px;overflow:auto}
.file-preview pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 var(--mono);margin:0}
.file-preview .big-skip{color:var(--muted);padding:24px;text-align:center}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

function kindOfName(n){n=(n||"").toLowerCase();if(/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(n))return"image";if(/\.(mp4|webm|mov|m4v)$/.test(n))return"video";if(/\.(pdf)$/.test(n))return"pdf";if(/\.(txt|md|json|js|ts|css|html?|xml|csv|env|log|yml|yaml|toml|py|go|rs|java|c|cpp|h|sh|sql)$/.test(n))return"text";return"bin"}
async function previewFile(f){
  const name=f.name||f.original_name||"file";
  const size=f.size||0;
  const k=kindOfName(name);
  let body="";
  if(k==="image"){
    const url=(f instanceof Blob)?(f._u||(f._u=URL.createObjectURL(f))):(f.url||"");
    body=`<img src="${esc(url)}" style="max-width:100%;border-radius:12px" alt="">`;
  } else if(k==="text"){
    if(size > PREVIEW_MAX){
      body=`<div class="big-skip"><b>File is large (${fmt(size)})</b><p class="sub">Text preview skipped to keep the UI fast.</p><button class="btn s mt" data-a="downloadOne" data-x="${F.indexOf(f)}">Download</button></div>`;
    } else {
      try{
        let text="";
        if(f instanceof Blob) text=await f.text();
        else if(f.url) text=await (await fetch(f.url)).text();
        else if(WV.on && f.id){const b=await WV.blob(f);text=await b.text()}
        else text="(no local content)";
        body=`<pre>${esc(text.slice(0,80000))}</pre>`;
      }catch(e){body=`<p class="sub">Could not read text: ${esc(e.message||"error")}</p>`}
    }
  } else {
    body=`<div class="big-skip"><b>${esc(name)}</b><p class="sub">${k.toUpperCase()} · ${fmt(size)} — binary or unsupported preview</p><button class="btn s mt" data-a="downloadOne" data-x="${F.indexOf(f)}">Download</button></div>`;
  }
  modal("Preview · "+esc(name), `<div class="file-preview">${body}</div><div class="pa mt"><button class="btn g" data-a="close">Close</button><button class="btn" data-a="downloadOne" data-x="${F.indexOf(f)}">Download</button></div>`);

function siteRenderPart(s,idx,sel){
  const on=idx===sel?" sbp-on":"";
  const part=SB_PARTS.find(p=>p.type===s.type)||{};
  const v=s.variant||(part.variants&&part.variants[0])||"default";
  const h=esc(s.h||""),b=esc(s.b||"");

  const wrapExtra=(s.bg?"background:"+esc(s.bg)+";":"")+(s.pad?"padding:"+s.pad+"px;":"");

  const bodyStyle="font-size:"+(s.bodySize||15)+"px;color:"+esc(s.bodyColor||"#9aa3b2")+";margin:0";

    else html="<div class=\"sbp sbp-nav"+on+"\" data-a=\"sbSel\" data-x=\""+idx+"\" style=\""+wrapExtra+"\"><b style=\""+titleStyle+"\">"+h+"</b><div class=\"sbp-nav-links\">"+links.map(l=>"<span>"+esc(l)+"</span>").join("")+"</div></div>";
  }else if(s.type==="hero"){

    if(v==="split")html="<div class=\"sbp sbp-hero sbp-hero-split"+on+"\" data-a=\"sbSel\" data-x=\""+idx+"\" style=\""+wrapExtra+"\"><div><h1 style=\""+titleStyle+"\">"+h+"</h1><p style=\""+bodyStyle+"\">"+b+"</p>"+btnHtml+"</div><div class=\"sbp-hero-art\">"+(s.img?"<img src=\""+esc(s.img)+"\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;border-radius:16px\">":"")+"</div></div>";
    else html="<div class=\"sbp sbp-hero"+on+"\" data-a=\"sbSel\" data-x=\""+idx+"\" style=\""+wrapExtra+"\">"+(s.img?"<img src=\""+esc(s.img)+"\" alt=\"\" style=\"width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-bottom:14px\">":"")+"<h1 style=\""+titleStyle+"\">"+h+"</h1><p style=\""+bodyStyle+"\">"+b+"</p>"+btnHtml+"</div>";

function storyApplyGrade(){
  const vid=$("#veVid"),se=M.storyEdit;if(!vid||!se||!se.grade)return;
  const g=se.grade;
  let on=true;
  if(g.scope==="time")on=vid.currentTime>=Number(g.at||0)-0.05;
  if(!on){vid.style.filter="none";return}
  const bri=1+((g.lift||0)/50)*0.12+((g.gain||1)-1)*0.5;
  const con=1+((g.gamma||1)-1)*0.5;
  vid.style.filter="brightness("+bri+") contrast("+con+") saturate("+(g.sat||1)+") hue-rotate("+(((g.temp||0)*0.35)+((g.tint||0)*0.2))+"deg)";
}

function storyDrawScopes(){
  const vid=$("#veVid"),wave=$("#veWave"),parade=$("#veParade"),line=$("#veLine");
  if(!vid||!wave||!vid.videoWidth)return;
  try{
    const w=96,h=54,tmp=document.createElement("canvas");tmp.width=w;tmp.height=h;
    const tx=tmp.getContext("2d",{willReadFrequently:true});tx.drawImage(vid,0,0,w,h);
    const data=tx.getImageData(0,0,w,h).data;
    const ww=wave.width,wh=wave.height,wx=wave.getContext("2d");
    wx.fillStyle="#0a0c10";wx.fillRect(0,0,ww,wh);
    wx.strokeStyle="#1e2430";for(let y=0;y<=4;y++){wx.beginPath();wx.moveTo(0,wh*y/4);wx.lineTo(ww,wh*y/4);wx.stroke()}
    for(let x=0;x<w;x++)for(let y=0;y<h;y++){
      const i=(y*w+x)*4,r=data[i],g=data[i+1],b=data[i+2],lx=Math.floor(x/w*ww);
      const yL=wh-1-((0.2126*r+0.7152*g+0.0722*b)/255)*(wh-1);
      wx.fillStyle="rgba(220,220,220,.4)";wx.fillRect(lx,yL,1,1);
      wx.fillStyle="rgba(255,70,70,.35)";wx.fillRect(lx,wh-1-(r/255)*(wh-1),1,1);
      wx.fillStyle="rgba(70,220,100,.35)";wx.fillRect(lx,wh-1-(g/255)*(wh-1),1,1);
      wx.fillStyle="rgba(70,140,255,.35)";wx.fillRect(lx,wh-1-(b/255)*(wh-1),1,1);
    }
    if(parade){const pw=parade.width,ph=parade.height,px=parade.getContext("2d");px.fillStyle="#0a0c10";px.fillRect(0,0,pw,ph);
      const third=Math.floor(pw/3);
      for(let ch=0;ch<3;ch++){const col=ch===0?"rgba(255,70,70,.75)":ch===1?"rgba(70,220,100,.75)":"rgba(70,140,255,.75)";
        for(let x=0;x<third;x++){const sx=Math.min(w-1,Math.floor(x/third*w));let sum=0,n=0;for(let y=0;y<h;y++){sum+=data[(y*w+sx)*4+ch];n++}
          px.fillStyle=col;px.fillRect(ch*third+x,ph-1-(sum/n/255)*(ph-1),1,2)}}}
    if(line){const lw=line.width,lh=line.height,lx=line.getContext("2d");lx.fillStyle="#0a0c10";lx.fillRect(0,0,lw,lh);
      lx.beginPath();lx.strokeStyle="#d0d0d0";lx.lineWidth=1.5;

        const yy=lh-1-(s/n/255)*(lh-1);if(x===0)lx.moveTo(x,yy);else lx.lineTo(x,yy)}lx.stroke()}
  }catch(e){}
}

function storyMountScopes(){
  const vid=$("#veVid");if(!vid)return;
  storyApplyGrade();
  const tick=()=>{storyDrawScopes();if(!vid.paused&&!vid.ended)requestAnimationFrame(tick)};
  vid.onplay=()=>{requestAnimationFrame(tick)};
  vid.onpause=storyDrawScopes;
  vid.onloadeddata=()=>{storyDrawScopes();storyApplyGrade()};
  vid.onseeked=storyDrawScopes;
  vid.ontimeupdate=()=>{storyApplyGrade();if(vid.paused)storyDrawScopes()};
  $$("[data-g]").forEach(el=>{el.oninput=function(){if(!M.storyEdit)return;const k=el.dataset.g,v=+el.value;
    if(k==="gamma"||k==="gain"||k==="sat")M.storyEdit.grade[k]=v/100;else M.storyEdit.grade[k]=v;storyApplyGrade();storyDrawScopes()}});
  const norm=$("#veNorm");if(norm)norm.onchange=()=>{if(M.storyEdit)M.storyEdit.grade.norm=norm.checked};
  if(vid.readyState>=2)storyDrawScopes();
}

function storyThumb(url){
  return new Promise(function(res){
    const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";
    let done=false;const finish=function(d){if(done)return;done=true;try{v.src="";v.load()}catch(e){}res(d||"")};
    const to=setTimeout(function(){finish("")},4000);
    v.onloadeddata=function(){try{v.currentTime=Math.min(0.25,(v.duration||1)*0.05)}catch(e){finish("")}};
    v.onseeked=function(){try{const c=document.createElement("canvas");c.width=160;c.height=90;c.getContext("2d").drawImage(v,0,0,160,90);clearTimeout(to);finish(c.toDataURL("image/jpeg",0.7))}catch(e){clearTimeout(to);finish("")}};
    v.onerror=function(){clearTimeout(to);finish("")};v.src=url;
  });
}
function storyDur(url){
  return new Promise(function(res){
    const v=document.createElement("video");v.preload="metadata";
    const to=setTimeout(function(){res(0);try{v.src=""}catch(e){}},5000);
    v.onloadedmetadata=function(){clearTimeout(to);res(v.duration||0);try{v.src=""}catch(e){}};

  });
}

const tb=tab("run"),ex=example(t,1),ep=BASE()+"/v1/tools/"+t.id+"/run",body=JSON.stringify(example(t,0),null,2);

:tb=="webhook"?`<div class="grid"><div class="card c7"><div class="row" style="padding-top:0"><div class="t"><b>Inbound webhook</b><span>Other sites call this endpoint with an API key that has the tools:run scope.</span></div>${sw(!D.off[t.id],"toolhook",t.id)}</div><div class="chips mt"><span class="chip">POST</span><span class="chip" style="font-family:var(--mono)">${esc(ep)}</span></div><div class="tabs mt">${[["curl","cURL"],["js","JavaScript"],["py","Python"]].map(i=>`<button class="${sn==i[0]?"on":""}" data-a="snip" data-x="${i[0]}">${i[1]}</button>`).join("")}</div>${code(snip[sn])}<p class="sub mt">File inputs take a URL or <code>{ "name", "base64" }</code> on your server. In local mode you can also pass <code>drive://filename</code>.</p></div><div class="card c5"><h3>Try the endpoint</h3><label class="f">API key</label><input class="inp" id="pk" placeholder="aux_live_..." value="${esc(M.pk||"")}"><label class="f">Request body</label><textarea class="inp" id="pb" style="min-height:150px;font-family:var(--mono);font-size:.82rem">${esc(JSON.stringify(ex,null,2))}</textarea><button class="btn mt" data-a="pg">${ic("send")}Send</button><div id="pres"></div></div></div>`
:tb=="mcp"?`<div class="card"><div class="row" style="padding-top:0"><div class="t"><b>Expose as MCP tool</b><span>Clients that connect to ${esc(BASE())}/mcp can call <code>${mcpName(t)}</code>.</span></div>${sw(mcpOn(t.id),"toolmcp",t.id)}</div>${code(JSON.stringify({jsonrpc:"2.0",id:1,method:"tools/call",params:{name:mcpName(t),arguments:example(t,0)}},null,2))}</div>`

:`<div class="grid"><div class="card c6"><h3>Call a tool from another site</h3><p class="sub mt">Every tool has an endpoint. Create an API key with the tools:run scope, then send a POST request.</p>${code(`POST ${BASE()}/v1/tools/{tool-id}/run\nAuthorization: Bearer aux_live_...\nContent-Type: application/json\n\n{ "text": "..." }`)}<button class="btn g mt" data-a="go" data-x="tools">Browse tools</button></div><div class="card c6"><h3>Verify signatures</h3><p class="sub mt">Each delivery carries X-Auxobus-Signature as <code>t=&lt;ms&gt;,v1=&lt;hex&gt;</code>, an HMAC-SHA256 of <code>t + "." + rawBody</code> with your endpoint secret.</p>${code(`import crypto from "node:crypto";\n\nexport function verify(secret, header, rawBody) {\n  const [t, v1] = header.split(",").map(p => p.split("=")[1]);\n  const mac = crypto.createHmac("sha256", secret)\n    .update(t + "." + rawBody).digest("hex");\n  return crypto.timingSafeEqual(Buffer.from(mac), Buffer.from(v1));\n}`)}</div><div class="card c12"><h3>Events</h3><div class="chips mt">${EVENTS.map(e=>`<span class="chip" style="font-family:var(--mono)">${e}</span>`).join("")}</div></div></div>`)},

:tb=="inspector"?`<div class="two"><div class="card"><label class="f">Method</label><select class="inp" id="im" data-a="imSel"><option>initialize</option><option selected>tools/list</option><option>tools/call</option></select><label class="f">Tool</label><select class="inp" id="it" data-a="itSel">${TOOLS.map(t=>`<option value="${mcpName(t)}">${mcpName(t)}</option>`).join("")}</select><label class="f">Arguments (JSON)</label><textarea class="inp" id="ia" style="min-height:160px;font-family:var(--mono);font-size:.82rem">{}</textarea><button class="btn mt" data-a="imSend">${ic("send")}Send</button><p class="sub mt">Runs locally with the same methods as the server.</p></div><div class="card"><h3>Exchange</h3><div class="out" id="io">Send a request.</div></div></div>`

api(){const tb=tab("server");return ph("API","Server connection, keys and spec.")+TB([["server","Server"],["keys","API keys"],["openapi","OpenAPI"],["audit","Audit log"]])+(tb=="server"?`<div class="grid"><div class="card c6"><h3>Connection</h3><p class="sub mt">Mode: <b style="color:var(--ink)">${server()?"Server":"Local"}</b>. With no base URL, data stays in this browser.</p><label class="f">API base URL</label><input class="inp" id="cb" value="${esc(CFG.apiBase)}" placeholder="https://YOUR-DOMAIN.com/api"><label class="f">Access token</label><input class="inp" id="ct" type="password" value="${esc(CFG.token)}"><label class="f">Diffusion endpoint (optional, overrides /v1/diffusion/generations)</label><input class="inp" id="cd" value="${esc(CFG.diffusion)}" placeholder="https://..."><div class="chips mt"><button class="btn" data-a="saveCfg">Save and reload data</button><button class="btn g" data-a="health">Test connection</button></div><div id="hres" class="sub mt"></div></div><div class="card c6"><h3>Resources</h3><p class="sub mt">REST resources. Lists return <code>{ "data": [...] }</code>.</p>${tbl(["Path","Holds"],Object.entries(COLMAP).map(([k,p])=>[`<span style="font-family:var(--mono)">/v1/${p}</span>`,k]).concat([["<span style=\"font-family:var(--mono)\">/v1/files</span>","Drive files (multipart upload)"],["<span style=\"font-family:var(--mono)\">/v1/tools/{id}/run</span>","Tool execution"],["<span style=\"font-family:var(--mono)\">/mcp</span>","MCP endpoint"]]),"")}</div></div>`

diffusion(){
  const jobs=D.creative||[];
  const job=jobs.find(c=>c.id==M.cp)||jobs[0];
  if(job)M.cp=job.id;
  if(job&&!job.qa)job.qa=[{q:"",a:""}];
  const runs=D.gens.filter(g=>!job||g.cp==job.id);
  const tabs=jobs.map(c=>'<button class="'+(c.id==M.cp?"on":"")+'" data-a="cpSel" data-x="'+c.id+'">'+esc(c.n)+'</button>').join("")||'<span class="sub">No training projects yet</span>';
  const purposes=[["contact","Contact forms"],["chat","Live chat"],["search","Site search"],["support","Support"],["custom","Custom"]];
  const purposeChips=purposes.map(s=>'<button type="button" class="pill '+((job&&job.purpose||"contact")==s[0]?"on":"")+'" data-a="diffSet" data-k="purpose" data-x="'+s[0]+'">'+s[1]+'</button>').join("");
  const modelOpts=[["contact-tiny","Contact agent · tiny"],["chat-tiny","Live chat · tiny"],["search-tiny","Search · tiny"],["support-tiny","Support · tiny"]].map(m=>'<option value="'+m[0]+'" '+(job&&job.model===m[0]?"selected":"")+'>'+m[1]+'</option>').join("");
  let main="";
  if(job){
    const pn=(D.projects.find(x=>x.id==job.project)||{}).n||"";
    const qaRows=(job.qa||[{q:"",a:""}]).map(function(r,idx){
      return '<div class="diff-qa">'
        +'<label class="f">Question '+(idx+1)+'</label>'
        +'<input class="inp" data-a="diffQA" data-i="'+idx+'" data-k="q" value="'+esc(r.q||"")+'" placeholder="What customers ask">'
        +'<label class="f">Answer</label>'
        +'<textarea class="inp" rows="2" data-a="diffQA" data-i="'+idx+'" data-k="a" placeholder="Ideal reply">'+esc(r.a||"")+'</textarea>'
        +'<button type="button" class="btn g s" data-a="diffDelQA" data-x="'+idx+'">Remove</button></div>';
    }).join("");
    main='<div class="chips" style="margin-bottom:12px"><span class="chip ok">'+esc(job.status||"draft")+'</span>'
      +(job.project?'<span class="chip">'+esc(pn)+'</span>':'')
      +(job.hook?'<span class="chip ok">Webhook</span>':'')+'</div>'
      +'<label class="f">What this model should do</label><div class="chips">'+purposeChips+'</div>'
      +'<label class="f">Base model</label><select class="inp" data-a="diffField" data-k="model">'+modelOpts+'</select>'
      +'<div class="diff-build"><div class="ph2"><h3>Build training data</h3><span class="sub">No file upload required</span></div>'
      +qaRows
      +'<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0">'
      +'<button type="button" class="btn g s" data-a="diffAddQA">'+ic("plus")+'Add example</button>'
      +'<button type="button" class="btn g s" data-a="diffBuildDataset">Compile dataset</button></div>'
      +'<label class="f">Compiled dataset (editable)</label>'
      +'<textarea class="inp" rows="4" data-a="diffField" data-k="dataset" placeholder="Q/A pairs compile here">'+esc(job.dataset||"")+'</textarea></div>'
      +'<label class="f">Do not answer / refuse</label><input class="inp" data-a="diffField" data-k="neg" value="'+esc(job.neg||"")+'" placeholder="Topics this model must avoid">'
      +'<div class="two"><div><label class="f">Epochs</label><input class="inp" type="number" min="1" max="50" data-a="diffField" data-k="epochs" value="'+esc(String(job.epochs||8))+'"></div>'
      +'<div><label class="f">Learning rate</label><input class="inp" data-a="diffField" data-k="lr" value="'+esc(job.lr||"2e-4")+'"></div></div>'
      +'<button class="btn mt" data-a="diffTrain" style="width:100%">'+ic("bolt")+'Start training run</button>'+'<button class="btn g s mt" data-a="delDiffJob" style="width:100%">'+ic("trash")+'Delete training project</button>'
      +'<div class="sub mt" id="diffStatus">'+esc(job.lastMsg||"")+'</div>';
  }else{
    main=em("No training project","Create a project, then build examples step by step.");
  }
  const apiBase=(typeof CFG!=="undefined"&&CFG.apiBase?CFG.apiBase:"https://api.auxa.cloud").replace(/\/$/,"");
  let connect='<h3 style="margin:0 0 8px;font:600 1rem var(--display)">Connect to your site</h3><p class="sub" style="margin:0 0 12px">Webhooks or API for live chat, search, and forms.</p>';
  if(job){
    connect+='<label class="f">Webhook URL</label><input class="inp" data-a="diffField" data-k="hook" value="'+esc(job.hook||"")+'" placeholder="https://yoursite.com/api/auxa-hook">'
      +'<label class="f">API path</label><input class="inp" readonly value="'+esc(apiBase+"/v1/models/"+job.id+"/chat")+'">'
      +'<button class="btn g s mt" data-a="diffSaveConnect">Save connection</button>';
  }else connect+='<p class="sub">Create a training project first.</p>';
  const runList=runs.length?runs.map(g=>'<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="t"><b>'+esc(g.model||"run")+'</b><span>'+esc((g.prompt||"").slice(0,80))+'</span></div><span class="chip '+(g.ok?"ok":"")+'">'+(g.ok?"ok":"sample")+'</span></div>').join(""):'<p class="sub">No runs yet.</p>';
  return ph("Diffusion","Train models on clean examples you build here. Connect via webhook or API.",
    '<button class="btn" data-a="newDiffJob">'+ic("plus")+'New training project</button>')
    +'<div class="dif-layout"><div class="card dif-main"><div class="tabs" style="margin-bottom:12px">'+tabs+'</div>'+main+'</div>'
    +'<div class="stack"><div class="card">'+connect+'</div><div class="card"><h3 style="margin:0 0 8px;font:600 1rem var(--display)">Training runs</h3>'+runList+'</div></div></div>';
},

VW.qa=function(){

sitePublish(){

  const t=document.getElementById("siteTopTitle");
  if(t)sb.title=(t.textContent||"").trim()||"Site";
  ensureFolders();
  // HTML body matches editor render
  const bodyHtml=sb.stack.map(function(s,i){return siteRenderPart(s,i,-1)}).join("");
  const fullHtml="<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>"+esc(sb.title)+"</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#0b0d12;color:#f2f4f8}a{color:inherit}</style></head><body>"+bodyHtml+"</body></html>";
  const payload={v:1,kind:"wurl",title:sb.title,stack:sb.stack,accent:sb.accent,html:fullHtml,liveChatModel:sb.liveChatModel||null,publishedAt:Date.now()};
  const slug=(sb.title||"site").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"site";
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const file=mk(blob,slug+".wurl","application/wurl+json");
  // WURLS
  let wurls=D.folders.find(f=>f.n==="WURLS"&&!f.parent);
  if(!wurls){wurls={id:"wurls-root",n:"WURLS",parent:null,shared:true,readonly:true};D.folders.unshift(wurls)}
  file.folder=wurls.id;
  for(let i=F.length-1;i>=0;i--){if(F[i].folder===wurls.id&&F[i].name===file.name)F.splice(i,1)}
  F.unshift(file);
  if(WV.on){WV.upload(file).then(r=>{file.id=r.id;file.hash=r.hash;file.wv=1;toast("Saved .wurl to Auxa Drive")}).catch(e=>console.warn("wurl upload",e))}
  // Project directory real files
  if(sb.projectId){
    const p=D.projects.find(x=>x.id===sb.projectId);
    if(p){
      p.siteStack=sb.stack;p.n=sb.title;p.template=sb.template;p.accent=sb.accent;
      const pages=D.folders.find(f=>f.parent===p.folder&&(f.n==="sitefiles"||f.n==="Pages"));
      const seo=D.folders.find(f=>f.parent===p.folder&&f.n==="SEO");
      const assets=D.folders.find(f=>f.parent===p.folder&&f.n==="Assets");
      const put=function(folderId,name,content,type){
        if(!folderId)return;
        for(let i=F.length-1;i>=0;i--){if(F[i].folder===folderId&&F[i].name===name)F.splice(i,1)}
        const fl=mk(new Blob([content],{type:type||"text/plain"}),name,type||"text/plain");
        fl.folder=folderId;F.unshift(fl);
      };
      put(pages&&pages.id,slug+".html",fullHtml,"text/html");
      put(pages&&pages.id,slug+".wurl",JSON.stringify(payload),"application/json");
      put(seo&&seo.id,"seo.json",JSON.stringify({title:sb.title,description:(sb.stack[1]&&sb.stack[1].b)||"",sections:sb.stack.length},null,2),"application/json");
      put(assets&&assets.id,"site-manifest.json",JSON.stringify({title:sb.title,stack:sb.stack.map(s=>({type:s.type,variant:s.variant,h:s.h}))},null,2),"application/json");
    }
  }
  sb.published={at:Date.now(),title:sb.title,sections:sb.stack.length,file:file.name};
  D.runs.unshift({id:rid(6),tool:"site-builder",ts:Date.now(),src:"publish",ms:24,ok:1});
  store();
  toast("Published · "+file.name+" + project files");
},

openWurl(idx){
  const f=F[+idx];if(!f)return;
  const read=()=>{
    const fr=new FileReader();
    fr.onload=()=>{try{
      const data=JSON.parse(fr.result);
      M.wurlView=data;A.openWurlLayer();
    }catch(e){toast("Invalid .wurl file")}};
    fr.readAsText(f instanceof Blob?f:new Blob([f]));
  };
  if(f instanceof Blob)read();
  else if(f.url)fetch(f.url).then(r=>r.text()).then(t=>{try{M.wurlView=JSON.parse(t);A.openWurlLayer()}catch(e){toast("Invalid .wurl")}}).catch(()=>toast("Could not open"));
  else toast("Cannot read file");
},
openWurlLayer(){
  let L=document.getElementById("wurlLayer");
  if(!L){L=document.createElement("div");L.id="wurlLayer";L.className="wurl-layer";document.body.appendChild(L)}
  const data=M.wurlView||{title:"Site",stack:[]};
  const body=(data.html)||((data.stack||[]).map(function(s,i){return siteRenderPart(s,i,-1)}).join(""))||"<p class=sub style=padding:24px>Empty site</p>";
  var chat='';if(data.liveChatModel){var m=(D.creative||[]).find(function(c){return c.id===data.liveChatModel});chat='<div class="wurl-chat"><b>Live chat</b><span class="sub">'+(m?esc(m.n):'Model')+' · connected</span><input class="inp" placeholder="Ask…" disabled><button class="btn g s" disabled>Send</button></div>'}L.innerHTML='<div class="wurl-top"><button type="button" class="ib" data-a="closeWurl" aria-label="Close"><svg class="i"><use href="#x"/></svg></button><b>'+esc(data.title||"Site")+'</b><span class="sub">.wurl</span></div><div class="wurl-body">'+body+chat+'</div>';

async delProject(id){
  const p=D.projects.find(x=>x.id==id);
  if(!p)return;
  D.builds=D.builds.filter(b=>b.p!=id);
  // remove diffusion jobs tied to this project
  const jobIds=new Set((D.creative||[]).filter(c=>c.project==id).map(c=>c.id));
  if(jobIds.size){
    D.creative=D.creative.filter(c=>c.project!=id);
    D.gens=(D.gens||[]).filter(g=>!jobIds.has(g.cp));
  }
  // always delete folder tree + files
  const rootId=p.folder;
  const kill=new Set();
  if(rootId){
    const queue=[rootId];
    while(queue.length){
      const idf=queue.pop();
      if(kill.has(idf))continue;
      kill.add(idf);
      D.folders.filter(f=>(f.parent||null)==idf).forEach(f=>queue.push(f.id));
    }
    for(let i=F.length-1;i>=0;i--){if(kill.has(F[i].folder))F.splice(i,1)}
    D.folders=D.folders.filter(f=>!kill.has(f.id));
  }
  await mut("projects","del",{id});
  store();
  lg("Project deleted",p.n);
  toast("Project, folders, and linked models removed");
  if(M.ctx=="project")go("projects");else{shell();render()}
},

const OV_DRAW={
code:(ctx,w,h,t)=>{ctx.fillStyle='#0a1620';ctx.fillRect(0,0,w,h);ctx.font=`${Math.max(10,w*0.04)}px ui-monospace,monospace`;const lines=['const app = build({','  target: "hybrid",','  research: true,','  ship: "auxa"','});','app.preview();'];lines.forEach((L,i)=>{ctx.fillStyle=`rgba(70,195,123,${0.35+0.1*(i%3)})`;ctx.fillText(L,w*0.08,h*0.22+i*(h*0.12));});ctx.strokeStyle='rgba(70,195,123,0.25)';ctx.lineWidth=1;for(let i=0;i<6;i++){const y=h*0.15+((t*30+i*40)%(h*0.8));ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}},
mesh:(ctx,w,h,t)=>{
  // dark blob mixture (research-style)
  ctx.fillStyle='#0a0c12';ctx.fillRect(0,0,w,h);
  const blobs=[
    {x:0.3,y:0.35,r:0.42,c:[40,80,180]},
    {x:0.72,y:0.28,r:0.38,c:[120,40,160]},
    {x:0.5,y:0.7,r:0.45,c:[20,100,140]},
    {x:0.15,y:0.75,r:0.32,c:[80,30,120]},
    {x:0.85,y:0.65,r:0.3,c:[30,60,150]}
  ];
  blobs.forEach((b,i)=>{
    const px=b.x*w+Math.sin(t*0.7+i)*w*0.04, py=b.y*h+Math.cos(t*0.5+i*1.2)*h*0.04;
    const g=ctx.createRadialGradient(px,py,0,px,py,b.r*Math.min(w,h));
    const a=0.55+0.15*Math.sin(t+i);
    g.addColorStop(0,`rgba(${b.c[0]},${b.c[1]},${b.c[2]},${a})`);
    g.addColorStop(0.55,`rgba(${b.c[0]},${b.c[1]},${b.c[2]},0.2)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,b.r*Math.min(w,h),0,7);ctx.fill();
  });
},
agent:(ctx,w,h,t)=>{
  // same dark blob mixture for research vibe
  OV_DRAW.mesh(ctx,w,h,t*0.9+1);
  const nodes=[[0.35,0.4],[0.65,0.35],[0.5,0.6]];
  ctx.strokeStyle='rgba(180,160,255,0.25)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(nodes[0][0]*w,nodes[0][1]*h);ctx.lineTo(nodes[1][0]*w,nodes[1][1]*h);ctx.lineTo(nodes[2][0]*w,nodes[2][1]*h);ctx.closePath();ctx.stroke();
  nodes.forEach((n,i)=>{ctx.fillStyle='rgba(200,180,255,0.7)';ctx.beginPath();ctx.arc(n[0]*w,n[1]*h,4+2*Math.sin(t*2+i),0,7);ctx.fill();});
},
glow:(ctx,w,h,t)=>{
  ctx.fillStyle='#0c0a08';ctx.fillRect(0,0,w,h);
  [[0.4,0.4,0.5,[180,100,40]],[0.7,0.55,0.4,[140,60,30]],[0.25,0.65,0.35,[100,50,20]]].forEach((b,i)=>{
    const px=b[0]*w+Math.sin(t+i)*8,py=b[1]*h+Math.cos(t*0.8+i)*8;
    const g=ctx.createRadialGradient(px,py,0,px,py,b[2]*Math.min(w,h));
    g.addColorStop(0,`rgba(${b[3][0]},${b[3][1]},${b[3][2]},0.55)`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,b[2]*Math.min(w,h),0,7);ctx.fill();
  });
}
};

function mountOvMedia(){
  if(window.__ovRafs){window.__ovRafs.forEach(function(id){cancelAnimationFrame(id)});window.__ovRafs=[];}
  else window.__ovRafs=[];
  $$('.dub .um[data-ov]').forEach(function(media){
    var canvas=media.querySelector('canvas');
    var video=media.querySelector('video');
    var kind=media.dataset.ov;
    var dpr=Math.min(window.devicePixelRatio||1,1.5);
    function size(){if(!canvas||!media.clientWidth)return;var w=Math.max(2,Math.round(media.clientWidth*dpr)),h=Math.max(2,Math.round(media.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
    size();
    if(kind==="video"&&video){
      var src=media.dataset.video||"";
      function fallback(){
        media.classList.remove("live");
        var draw=OV_DRAW.code;
        if(draw&&canvas){
          var last=0,start=performance.now();
          function tick(now){
            var id=requestAnimationFrame(tick);
            window.__ovRafs.push(id);
            if(now-last<50)return;
            last=now;size();
            draw(canvas.getContext("2d"),canvas.width,canvas.height,(now-start)/1000);
          }
          window.__ovRafs.push(requestAnimationFrame(tick));
        }
      }
      video.onerror=fallback;
      video.onplaying=function(){media.classList.add("live")};
      if(src){
        if(video.getAttribute("src")!==src) video.src=src;
        var p=video.play();
        if(p&&p.then)p.then(function(){media.classList.add("live")}).catch(fallback);
      } else fallback();
      return;
    }
    var draw=OV_DRAW[kind];
    if(!draw||!canvas) return;
    var last=0,start=performance.now();
    function tick(now){
      var id=requestAnimationFrame(tick);
      window.__ovRafs.push(id);
      if(now-last<50)return;
      last=now;size();
      draw(canvas.getContext("2d"),canvas.width,canvas.height,(now-start)/1000);
    }
    window.__ovRafs.push(requestAnimationFrame(tick));
  });
}

  const n=(se.title&&se.title!=="Untitled sequence"?se.title:"Story "+new Date().toLocaleDateString());
  const fo={id:rid(10),n:n,parent:null,project:null,shared:true};
  const p={id:rid(10),n,d:"Storytelling sequence",ind:"Media",t:[],kind:"film",folder:fo.id,created:Date.now()};
  fo.project=p.id;
  D.folders.push(fo);
  ["Footage","Grades","Deliverables"].forEach(function(name){D.folders.push({id:rid(10),n:name,parent:fo.id,project:p.id,shared:true})});
  D.projects.push(p);se.projectId=p.id;store();
  toast("Project · "+n);
  return p;
}

function storyImportFiles(fileList){
  try{
    const files=[].slice.call(fileList||[]);
    if(!files.length){if(typeof toast==="function")toast("No files selected");return}
    if(!M.storyEdit)M.storyEdit={mode:"edit",clips:[],sel:0,grade:Object.assign({},GRADE_DEF),title:"Untitled sequence",playing:false};
    const se=M.storyEdit;
    if(!Array.isArray(se.clips))se.clips=[];
    se.mode="edit";
    let added=0;
    files.forEach(function(f){
      if(!f)return;
      const name=f.name||"Clip";
      const t=(f.type||"").toLowerCase();
      const isVid=!t||t.indexOf("video/")===0||t==="application/octet-stream"||/\.(mp4|webm|mov|m4v|mkv|avi|3gp|ogv|mpeg|mpg)$/i.test(name);
      if(!isVid){if(typeof toast==="function")toast(name+" skipped");return}
      var url;
      try{url=URL.createObjectURL(f)}catch(err){if(typeof toast==="function")toast("Could not open "+name);return}
      // push immediately so timeline shows something
      var clip={id:rid(5),name:name.replace(/\.[^.]+$/,"").slice(0,40),url:url,thumb:"",dur:0,comp:1,size:f.size||0};
      se.clips.push(clip);
      added++;
      se.sel=se.clips.length-1;
      // enrich async
      try{
        storyDur(url).then(function(d){clip.dur=d||0}).catch(function(){});
        storyThumb(url).then(function(th){clip.thumb=th||"";if(typeof render==="function")render()}).catch(function(){});
      }catch(e){}
    });
    if(typeof render==="function")render();
    if(added)try{storyEnsureProject()}catch(e){}
if(typeof toast==="function")toast(added?(added+" clip(s) ready"):"No video added");
    setTimeout(function(){try{storyMountScopes()}catch(e){}},80);
  }catch(e){if(typeof toast==="function")toast(e.message||"Import failed")}
}
function storyBindPicker(){
  var fi=document.getElementById("veFilePick");
  if(!fi){
    fi=document.createElement("input");
    fi.type="file";fi.id="veFilePick";fi.multiple=true;fi.hidden=true;
    fi.accept="video/*,video/mp4,video/webm,video/quicktime,video/x-m4v,.mp4,.webm,.mov,.m4v,.mkv,.3gp";
    document.body.appendChild(fi);
  }
  if(fi.dataset.bound==="1")return fi;
  fi.dataset.bound="1";
  fi.addEventListener("change",function(){
    var list=fi.files?Array.prototype.slice.call(fi.files):[];
    try{fi.value=""}catch(e){}
    storyImportFiles(list);
  });
  return fi;
}

try{storyBindPicker()}catch(e){}
A.preview=(i)=>{const f=F[+i];if(f)previewFile(f)};
A.downloadOne=(i)=>{const f=F[+i];if(!f)return;if(WV.on&&f.wv)WV.download(f);else if(f instanceof Blob)saveOut(f.name,f);else if(f.url)window.open(f.url,"_blank")};

A.qaToggle=(k)=>{const a=M.qaChecks||(M.qaChecks=["headers","cors","methods"]);const i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);render()};
A.qaRun=async()=>{
  const url=($("#qa_url")&&$("#qa_url").value||"").trim();
  if(!url)return toast("Enter a target URL",0);
  M.qaUrl=url;M.qaCc=+$("#qa_cc").value||5;M.qaN=+$("#qa_n").value||20;
  M.qaOut="Running…";render();
  try{
    let data;
    if(WV.on||server()){
      data=await (WV.on?WV.req("POST","/tools/qa/run",{target:url,tests:M.qaChecks||["headers","cors","methods"],stress:{concurrency:M.qaCc,requests:M.qaN}}):API.req("POST","/tools/qa/run",{target:url,tests:M.qaChecks||["headers","cors","methods"],stress:{concurrency:M.qaCc,requests:M.qaN}}));
    }else{
      // local fallback simulation
      data={target:url,checks:(M.qaChecks||[]).map(n=>({name:n,ok:true,note:"Local simulation — connect server for real probes"})),stress:{concurrency:M.qaCc,requests:M.qaN,ok:M.qaN,errors:0,rps:40,latency:{p50:18,p95:42}}};
    }
    M.qaOut=data;render();toast("Quality run finished");
  }catch(e){M.qaOut=String(e.message||e);render();toast("QA failed: "+(e.message||e),0)}
};
A.flowAdd=()=>{const s=M.flowSteps||(M.flowSteps=[]);s.push({id:rid(4),name:"New step",method:"POST",path:"/api/step",type:"action"});render()};
A.flowDel=(i)=>{const s=M.flowSteps||[];s.splice(+i,1);render()};
A.flowField=(i,el)=>{const s=(M.flowSteps||[])[+i];if(!s||!el)return;const k=el.dataset.k;if(k)s[k]=el.value};
A.flowValidate=async()=>{
  M.flowName=($("#fl_name")&&$("#fl_name").value)||"My platform flow";
  const steps=M.flowSteps||[];
  if(!steps.length)return toast("Add at least one step",0);
  try{
    if(WV.on||server()){
      const data=await (WV.on?WV.req("POST","/tools/flows/validate",{name:M.flowName,steps}):API.req("POST","/tools/flows/validate",{name:M.flowName,steps}));
      M.flowOut=data.apiSketch||JSON.stringify(data,null,2);
    }else{
      M.flowOut=steps.map(s=>`// ${s.name}\nrouter.${(s.method||"POST").toLowerCase()}('${s.path}', auth, async (req, res) => {\n  res.json({ ok: true, step: '${s.id}' });\n});`).join("\n\n");
    }
    render();toast("API sketch ready");
  }catch(e){toast(e.message||"Validate failed",0)}
};
A.flowExport=()=>{if(!M.flowOut)return toast("Validate first",0);const b=new Blob([M.flowOut],{type:"text/plain"});addFiles([new File([b],(M.flowName||"flow").replace(/\s+/g,"-")+".api.js",{type:"text/javascript"})]);toast("Saved API sketch to Drive")};
A.copyText=(id)=>{const el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.textContent||"").then(()=>toast("Copied")).catch(()=>toast("Copy failed",0))};

A.signout=()=>WV.logout();
ensureFolders();seedRooms();shell();render();API.load().then(()=>{ensureFolders();seedRooms();shell();render()});
</script>
